name: factory-mind-prod

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factorymind}
      POSTGRES_USER: ${POSTGRES_USER:-factorymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - factorymind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - factorymind-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-johnvo402}/factory-mind-api:${IMAGE_TAG:?IMAGE_TAG must be an immutable release SHA}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: "no"
    command: ["dotnet", "FactoryMind.Api.dll", "--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FactoryMind: Host=postgres;Port=5432;Database=${POSTGRES_DB:-factorymind};Username=${POSTGRES_USER:-factorymind};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BootstrapAdmin__CompanyName: ${BOOTSTRAP_COMPANY_NAME:-}
      BootstrapAdmin__Name: ${BOOTSTRAP_ADMIN_NAME:-}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-johnvo402}/factory-mind-api:${IMAGE_TAG:?IMAGE_TAG must be an immutable release SHA}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Release__Sha: ${IMAGE_TAG:?IMAGE_TAG must be an immutable release SHA}
      ConnectionStrings__FactoryMind: Host=postgres;Port=5432;Database=${POSTGRES_DB:-factorymind};Username=${POSTGRES_USER:-factorymind};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      Minio__Bucket: ${MINIO_BUCKET:-factorymind}
      Minio__UseSsl: "false"
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      Observability__Otlp__Enabled: ${OTLP_ENABLED:-false}
      Observability__Otlp__Endpoint: ${OTLP_ENDPOINT:-}
      Planning__DueSoonDays: ${PLANNING_DUE_SOON_DAYS:-3}
      Planning__DefaultScheduleHorizonDays: ${PLANNING_DEFAULT_SCHEDULE_HORIZON_DAYS:-14}
      Planning__MaximumScheduleHorizonDays: ${PLANNING_MAXIMUM_SCHEDULE_HORIZON_DAYS:-90}
      Planning__MaximumOrdersPerPreview: ${PLANNING_MAXIMUM_ORDERS_PER_PREVIEW:-500}
      Planning__MaximumOperationsPerPreview: ${PLANNING_MAXIMUM_OPERATIONS_PER_PREVIEW:-5000}
      BootstrapAdmin__CompanyName: ${BOOTSTRAP_COMPANY_NAME:-}
      BootstrapAdmin__Name: ${BOOTSTRAP_ADMIN_NAME:-}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-johnvo402}/factory-mind-frontend:${IMAGE_TAG:?IMAGE_TAG must be an immutable release SHA}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  factorymind-postgres-data:
  factorymind-minio-data:
