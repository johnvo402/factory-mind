name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore FactoryMind.sln

      - name: Verify formatting
        run: dotnet format FactoryMind.sln --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build FactoryMind.sln --configuration Release --no-restore --warnaserror

      - name: Run backend tests
        run: >-
          dotnet test FactoryMind.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults

      - name: Publish API artifact
        run: >-
          dotnet publish src/FactoryMind.Api/FactoryMind.Api.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/api

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: factory-mind-api
          path: artifacts/api
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build Angular application
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CI: true

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: factory-mind-frontend
          path: frontend/dist/frontend
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      MINIO_ROOT_USER: ci-minio-user
      MINIO_ROOT_PASSWORD: ci-minio-password
      JWT_KEY: ci-only-jwt-key-that-is-longer-than-thirty-two-characters
      GEMINI_API_KEY: ci-placeholder-key
      BOOTSTRAP_COMPANY_NAME: CI Factory
      BOOTSTRAP_ADMIN_NAME: CI Admin
      BOOTSTRAP_ADMIN_EMAIL: ci@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate production Compose configuration
        run: docker compose -f compose.prod.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FactoryMind.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/factory-mind-api:prod
            ghcr.io/${{ github.repository_owner }}/factory-mind-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/factory-mind-frontend:prod
            ghcr.io/${{ github.repository_owner }}/factory-mind-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
