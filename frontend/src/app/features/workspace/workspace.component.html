<main class="workspace">
  <a class="skip-link" href="#workspace-content">Chuyển đến nội dung chính</a>
  <app-workspace-sidebar
    [userName]="userName()"
    [userRole]="userRole()"
    [activeView]="activeView()"
    (logoutRequested)="logoutRequested.emit()"
  />
  <section #mainContent id="workspace-content" class="workspace-content" tabindex="-1">
    <router-outlet (activate)="focusMainContent()" />
  </section>
</main>
